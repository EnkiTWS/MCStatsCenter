<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Stat Central</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-900 text-white">

<!-- Navigation -->
<nav id="navbar" class="fixed top-0 left-0 w-full z-50"></nav>

<!-- Main Content -->
<div class="w-full max-w-4xl mx-auto text-center pt-24 px-4">
    <header class="mb-12">
        <img id="logo" alt="Minecraft Logo" class="mx-auto h-24 mb-4">
        <h1 id="page-title" class="text-4xl font-bold"></h1>
    </header>

    <main id="cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 pb-12"></main>
</div>

<script src="script.js"></script>
</body>
</html>
