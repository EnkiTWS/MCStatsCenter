<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Advancement Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-image: url('https://atlascraftmc.com/tools/deepslate_brick.png');
            background-repeat: repeat;
            background-attachment: fixed;
            background-size: 58px;
            image-rendering: pixelated;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(17, 24, 39, 0.85);
            z-index: -1;
        }
        .file-input-container {
            position: relative;
            width: 100%;
            height: 12rem;
            border: 2px dashed #4A5568;
            border-radius: 0.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out;
        }
        .file-input-container:hover {
            background-color: #2D3748;
        }
        .file-input {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2300A0A0%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.4-5.4-13z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat;
            background-position: right 0.7rem center;
            background-size: 0.65em auto;
            padding-right: 2.5rem;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .tab-btn.active {
            background-color: #0891B2; /* cyan-600 */
            color: #FFFFFF;
        }
        #player-skin-img {
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen p-4">
    
    <!-- Navigation Bar -->
    <nav class="fixed top-0 left-0 w-full bg-gray-900/50 backdrop-blur-sm border-b border-white/20 z-50">
        <div class="max-w-1xl mx-auto px-2">
            <div class="flex items-center space-x-6 h-12">
                <a href="https://atlascraftmc.com" class="text-sm text-cyan-400 hover:text-cyan-300 transition underline">Home</a>
                <a href="https://atlascraftmc.com/MCStats.html" class="text-sm text-cyan-400 hover:text-cyan-300 transition underline">Stats Creation Page</a>
                <a href="https://atlascraftmc.com/Autocraft/" class="text-sm text-cyan-400 hover:text-cyan-300 transition underline">All Autocraft Episodes</a>
            </div>
        </div>
    </nav>

    <div class="w-full max-w-4xl mx-auto text-center pt-24 px-4">
        <!-- Header -->    

    <div class="w-full max-w-7xl mx-auto">
        <header class="text-center mb-8">
            <img src="https://www.minecraft.net/content/dam/games/minecraft/logos/logo-minecraft.svg" alt="Minecraft Logo" class="mx-auto h-20">
            <h1 class="text-3xl font-bold text-cyan-400">Advancement Tool</h1>
            <a href="#" id="upload-new-btn" class="hidden text-sm text-cyan-400 hover:text-cyan-300 transition mt-2 block underline">Upload New Advancement File</a>
        </header>

        <main>
            <div id="upload-section" class="bg-gray-800/80 backdrop-blur-sm p-8 rounded-xl shadow-2xl max-w-2xl mx-auto">
                 <p class="text-center text-gray-300 mb-4">Upload your <code class="text-xs">advancements.json</code> file.</p>
                <div class="file-input-container" id="drop-zone">
                    <input type="file" id="file-input" class="file-input" accept=".json">
                    <div class="text-center text-gray-400">
                        <svg class="mx-auto h-12 w-12" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                            <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                        <p class="mt-2"><span class="font-semibold text-cyan-400">Click to upload</span> or drag and drop</p>
                        <p id="file-name" class="text-sm text-gray-300 mt-2"></p>
                    </div>
                </div>
                <div id="error-message" class="text-red-400 text-center mt-4"></div>
            </div>

            <div id="tool-section" class="hidden">
                <div class="mb-4 flex justify-center border-b border-gray-700">
                    <button id="viewer-tab-btn" class="tab-btn active px-6 py-3 font-medium text-gray-300 rounded-t-lg transition">Advancement Viewer</button>
                    <button id="creator-tab-btn" class="tab-btn px-6 py-3 font-medium text-gray-300 rounded-t-lg transition">File Creator</button>
                </div>

                <div id="viewer-content" class="flex flex-col md:flex-row gap-8">
                    <div id="player-skin-container" class="hidden md:w-48 flex-shrink-0 text-center">
                        <img id="player-skin-img" src="" alt="Player Skin" class="mx-auto rounded-lg shadow-lg bg-gray-700 w-full h-auto">
                        <p id="player-name-display" class="text-cyan-300 text-lg mt-2 h-6 font-bold"></p>
                    </div>
                    <div id="advancements-display-area" class="flex-grow">
                        <!-- Advancements will be rendered here -->
                    </div>
                </div>

                <div id="creator-content" class="hidden bg-gray-800/80 backdrop-blur-sm p-8 rounded-xl shadow-2xl space-y-6 max-w-2xl mx-auto">
                    <div>
                        <label for="category-select" class="block text-sm font-medium text-gray-300 mb-2">Category</label>
                        <select id="category-select" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg p-2.5 focus:ring-cyan-500 focus:border-cyan-500"><option>Waiting for file...</option></select>
                    </div>

                    <div id="advancement-select-div">
                        <label for="advancement-select" class="block text-sm font-medium text-gray-300 mb-2">Advancement</label>
                        <select id="advancement-select" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg p-2.5 focus:ring-cyan-500 focus:border-cyan-500" disabled><option>Select category first...</option></select>
                    </div>

                    <div id="localization-inputs" class="hidden space-y-4 pt-2">
                        <div>
                            <label for="award-title" class="block text-sm font-medium text-gray-300 mb-2">Award Title</label>
                            <input type="text" id="award-title" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg p-2.5 focus:ring-cyan-500 focus:border-cyan-500">
                        </div>
                        <div>
                            <label for="award-desc" class="block text-sm font-medium text-gray-300 mb-2">Award Description</label>
                            <input type="text" id="award-desc" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg p-2.5 focus:ring-cyan-500 focus:border-cyan-500">
                        </div>
                    </div>

                    <div class="pt-4">
                        <button id="create-btn" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 disabled:opacity-50 disabled:cursor-not-allowed" disabled>Create Files</button>
                    </div>

                    <div id="output-section" class="hidden pt-6 space-y-6">
                        <div>
                            <h2 class="text-xl font-bold text-cyan-300 mb-4">Advancement Reader File (.json)</h2>
                            <pre class="bg-gray-900 p-4 rounded-lg text-sm text-cyan-200"><code id="json-output"></code></pre>
                            <a id="download-link" class="mt-4 inline-block w-full text-center bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300">Download File</a>
                        </div>
                        <div>
                            <h2 class="text-xl font-bold text-cyan-300 mb-4">Localization File (en_us.json)</h2>
                            <pre class="bg-gray-900 p-4 rounded-lg text-sm text-yellow-200"><code id="lang-output"></code></pre>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- DOM Elements ---
        const uploadSection = document.getElementById('upload-section');
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileNameDisplay = document.getElementById('file-name');
        const errorMessage = document.getElementById('error-message');
        const playerNameDisplay = document.getElementById('player-name-display');
        const uploadNewBtn = document.getElementById('upload-new-btn');
        
        const toolSection = document.getElementById('tool-section');
        const viewerTabBtn = document.getElementById('viewer-tab-btn');
        const creatorTabBtn = document.getElementById('creator-tab-btn');
        const viewerContent = document.getElementById('viewer-content');
        const creatorContent = document.getElementById('creator-content');

        const playerSkinContainer = document.getElementById('player-skin-container');
        const playerSkinImg = document.getElementById('player-skin-img');
        const advancementsDisplayArea = document.getElementById('advancements-display-area');
        
        const categorySelect = document.getElementById('category-select');
        const advancementSelectDiv = document.getElementById('advancement-select-div');
        const advancementSelect = document.getElementById('advancement-select');
        const localizationInputs = document.getElementById('localization-inputs');
        const awardTitleInput = document.getElementById('award-title');
        const awardDescInput = document.getElementById('award-desc');
        const createBtn = document.getElementById('create-btn');
        const outputSection = document.getElementById('output-section');
        const jsonOutput = document.getElementById('json-output');
        const langOutput = document.getElementById('lang-output');
        const downloadLink = document.getElementById('download-link');

        // --- State & Config ---
        let loadedAdvancements = {};
        let categorizedAdvancements = {};
        
        const masterAdvancementList = [
            "story/root", "story/mine_stone", "story/upgrade_tools", "story/smelt_iron", "story/hot_stuff", "story/iron_tools", "story/deflect_arrow", "story/lava_bucket", "story/form_obsidian", "story/mine_diamond", "story/enter_the_nether", "story/shiny_gear", "story/enchant_item", "story/cure_zombie_villager", "story/follow_ender_eye", "story/enter_the_end",
            "nether/root", "nether/return_to_sender", "nether/find_fortress", "nether/get_wither_skull", "nether/obtain_blaze_rod", "nether/brew_potion", "nether/all_potions", "nether/all_effects", "nether/create_beacon", "nether/create_full_beacon", "nether/summon_wither", "nether/fast_travel", "nether/find_bastion", "nether/obtain_ancient_debris", "nether/hidden_in_the_depths", "nether/cover_me_in_debris", "nether/ride_strider", "nether/explore_nether", "nether/obtain_crying_obsidian", "nether/distract_piglin", "nether/loot_bastion", "nether/use_lodestone", "nether/netherite_armor", "nether/charge_respawn_anchor", "nether/ride_strider_in_overworld_lava", "nether/uneasy_alliance",
            "adventure/root", "adventure/kill_a_mob", "adventure/trade", "adventure/honey_block_slide", "adventure/ol_betsy", "adventure/sleep_in_bed", "adventure/hero_of_the_village", "adventure/throw_trident", "adventure/shoot_arrow", "adventure/kill_all_mobs", "adventure/totem_of_undying", "adventure/summon_iron_golem", "adventure/adventuring_time", "adventure/very_very_frightening", "adventure/sniper_duel", "adventure/bullseye", "adventure/walk_on_powder_snow_with_leather_boots", "adventure/lightning_rod_with_villager_no_fire", "adventure/spyglass_at_parrot", "adventure/spyglass_at_ghast", "adventure/spyglass_at_dragon", "adventure/kill_mob_near_sculk_catalyst", "adventure/avoid_vibration", "adventure/salvage_sherd", "adventure/craft_decorated_pot_using_only_sherds", "adventure/trim_with_any_armor_pattern", "adventure/trim_with_all_exclusive_armor_patterns", "adventure/read_power_of_chiseled_bookshelf", "adventure/blowback", "adventure/arbalistic", "adventure/two_birds_one_arrow", "adventure/overoverkill",
            "husbandry/root", "husbandry/safely_harvest_honey", "husbandry/breed_an_animal", "husbandry/tame_an_animal", "husbandry/fishy_business", "husbandry/tactical_fishing", "husbandry/breed_all_animals", "husbandry/complete_catalogue", "husbandry/plant_seed", "husbandry/balanced_diet", "husbandry/obtain_netherite_hoe", "husbandry/wax_on", "husbandry/wax_off", "husbandry/axolotl_in_a_bucket", "husbandry/kill_axolotl_target", "husbandry/ride_a_boat_with_a_goat", "husbandry/make_a_sign_glow", "husbandry/leash_all_frog_variants", "husbandry/tadpole_in_a_bucket", "husbandry/froglights", "husbandry/allay_deliver_item_to_player", "husbandry/allay_deliver_cake_to_note_block", "husbandry/obtain_sniffer_egg", "husbandry/feed_snifflet", "husbandry/plant_any_sniffer_seed", "husbandry/whole_pack",
            "end/root", "end/kill_dragon", "end/dragon_egg", "end/enter_end_gateway", "end/respawn_dragon", "end/dragon_breath", "end/find_end_city", "end/elytra", "end/levitate"
        ];

        // --- File Handling and Initialization ---
        async function fetchPlayerName(uuid) {
            playerNameDisplay.textContent = 'Fetching player name...';
            playerSkinContainer.classList.add('hidden');
            playerSkinImg.src = '';
            try {
                const response = await fetch(`https://api.ashcon.app/mojang/v2/user/${uuid}`);
                if (!response.ok) throw new Error('Player not found');
                const data = await response.json();
                playerNameDisplay.textContent = `Advancements for: ${data.username}`;
                playerSkinImg.src = `https://visage.surgeplay.com/front/256/${uuid}`;
                playerSkinContainer.classList.remove('hidden');
            } catch (error) {
                console.error("Could not fetch player name:", error);
                playerNameDisplay.textContent = 'Could not fetch player name.';
            }
        }

        function handleFile(file) {
            errorMessage.textContent = '';
            playerNameDisplay.textContent = '';
            if (!file || file.type !== 'application/json') {
                errorMessage.textContent = 'Invalid file type. Please upload a .json file.';
                return;
            }

            const fileName = file.name;
            const uuidMatch = fileName.match(/^([0-9a-fA-F]{8}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{12})/);
            if (uuidMatch) {
                const uuid = uuidMatch[1].replace(/-/g, '');
                fetchPlayerName(uuid);
            } else {
                playerNameDisplay.textContent = 'Could not determine player from filename.';
            }

            fileNameDisplay.textContent = `Processing: ${fileName}`;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const json = JSON.parse(event.target.result);
                    loadedAdvancements = json;
                    initializeTools();
                } catch (error) {
                    errorMessage.textContent = 'Error parsing JSON. Please ensure the file is valid.';
                    console.error("JSON Parsing Error:", error);
                }
            };
            reader.onerror = () => errorMessage.textContent = 'Error reading the file.';
            reader.readAsText(file);
        }

        function initializeTools() {
            uploadSection.classList.add('hidden');
            toolSection.classList.remove('hidden');
            uploadNewBtn.classList.remove('hidden');
            
            categorizeAdvancements();
            initializeViewer();
            initializeCreator();

            switchTab('viewer');
        }
        
        function categorizeAdvancements() {
            categorizedAdvancements = {
                'Minecraft': [], 'Nether': [], 'The End': [], 'Adventure': [], 'Husbandry': []
            };
            masterAdvancementList.forEach(advKey => {
                const fullKey = `minecraft:${advKey}`;
                const categoryName = advKey.split('/')[0];
                const formattedCategory = formatName(categoryName === 'story' ? 'minecraft' : categoryName);
                
                const isDone = loadedAdvancements[fullKey] && loadedAdvancements[fullKey].done;

                if (categorizedAdvancements[formattedCategory]) {
                    categorizedAdvancements[formattedCategory].push({ key: fullKey, done: isDone });
                }
            });
        }

        function switchTab(tabName) {
            if (tabName === 'viewer') {
                viewerContent.classList.remove('hidden');
                creatorContent.classList.add('hidden');
                viewerTabBtn.classList.add('active');
                creatorTabBtn.classList.remove('active');
            } else {
                viewerContent.classList.add('hidden');
                creatorContent.classList.remove('hidden');
                viewerTabBtn.classList.remove('active');
                creatorTabBtn.classList.add('active');
            }
        }

        // --- Viewer Logic ---
        function initializeViewer() {
            advancementsDisplayArea.innerHTML = '';
            renderAdvancements();
        }

        function formatName(rawName) {
            const parts = rawName.split(/[:/]/);
            let name = parts[parts.length - 1];
            name = name.replace(/_/g, ' ');
            return name.split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        }

        function renderAdvancements() {
            const specialAdvancements = new Set([
                'minecraft:adventure/hero_of_the_village',
                'minecraft:adventure/kill_mob_near_sculk_catalyst', // It Spreads
                'minecraft:adventure/kill_all_mobs', // Monsters Hunted
                'minecraft:adventure/trim_with_any_armor_pattern', // Smithing with Style
                'minecraft:adventure/two_birds_one_arrow',
                'minecraft:adventure/arbalistic',
                'minecraft:adventure/adventuring_time',
                'minecraft:adventure/sniper_duel',
                'minecraft:adventure/bullseye',
                'minecraft:adventure/blowback',
                'minecraft:adventure/overoverkill',
                'minecraft:nether/return_to_sender',
                'minecraft:nether/fast_travel', // Subspace Bubble
                'minecraft:nether/uneasy_alliance',
                'minecraft:nether/cover_me_in_debris',
                'minecraft:nether/explore_nether', // Hot Tourist Destinations
                'minecraft:nether/all_potions', // A Furious Cocktail
                'minecraft:nether/all_effects', // How Did We Get Here?
                'minecraft:end/levitate', // Great View From Up Here
                'minecraft:husbandry/breed_all_animals', // Two by Two
                'minecraft:husbandry/complete_catalogue', // A Complete Catalogue
                'minecraft:husbandry/balanced_diet',
                'minecraft:husbandry/obtain_netherite_hoe', // Serious Dedication
                'minecraft:husbandry/froglights', // With Our Powers Combined!
                'minecraft:husbandry/whole_pack'
            ]);

            const checkSVG = `<svg class="w-6 h-6 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            const xSVG = `<svg class="w-6 h-6 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;

            for (const category in categorizedAdvancements) {
                const advancements = categorizedAdvancements[category];
                if (advancements.length > 0) {
                    const categoryElement = document.createElement('div');
                    categoryElement.className = 'mb-8';
                    
                    const categoryTitle = document.createElement('h2');
                    categoryTitle.className = 'text-2xl font-bold text-cyan-300 border-b-2 border-gray-700 pb-2 mb-4';
                    categoryTitle.textContent = category;
                    categoryElement.appendChild(categoryTitle);

                    const grid = document.createElement('div');
                    grid.className = 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4';
                    
                    advancements.sort((a, b) => formatName(a.key).localeCompare(formatName(b.key)));

                    for (const adv of advancements) {
                        const card = document.createElement('div');
                        let cardClasses = 'bg-gray-800/80 backdrop-blur-sm p-4 rounded-lg shadow-lg flex items-center gap-4';
                        if (!adv.done) {
                            cardClasses += ' opacity-60';
                        }
                        card.className = cardClasses;
                        
                        if (specialAdvancements.has(adv.key)) {
                            card.style.border = '3px solid #a800a8';
                        }

                        card.innerHTML = `${adv.done ? checkSVG : xSVG}<p class="text-sm text-gray-300">${formatName(adv.key)}</p>`;
                        grid.appendChild(card);
                    }
                    categoryElement.appendChild(grid);
                    advancementsDisplayArea.appendChild(categoryElement);
                }
            }
        }

        // --- Creator Logic ---
        function initializeCreator() {
            const categories = Object.keys(categorizedAdvancements);
            populateSelect(categorySelect, categories, 'Choose a category...');
            resetSelect(advancementSelect, 'Select category first...');
            checkFormValidity();
        }
        
        function populateSelect(selectElement, options, defaultText) {
            selectElement.innerHTML = `<option selected disabled value="">${defaultText}</option>`;
            options.forEach(optionValue => {
                const isObject = typeof optionValue === 'object' && optionValue !== null;
                const optionElement = document.createElement('option');
                
                optionElement.value = isObject ? optionValue.key : optionValue;
                optionElement.textContent = formatName(isObject ? optionValue.key : optionValue);
                
                selectElement.appendChild(optionElement);
            });
            selectElement.disabled = false;
        }

        function resetSelect(selectElement, text) {
            selectElement.innerHTML = `<option value="">${text}</option>`;
            selectElement.disabled = true;
        }
        
        function updateLocalizationInputs() {
            const selection = advancementSelect.value;
            if (!selection) {
                localizationInputs.classList.add('hidden');
                return;
            }
            
            localizationInputs.classList.remove('hidden');
            
            const title = formatName(selection);
            awardTitleInput.value = title;
            awardDescInput.value = `Complete the "${title}" advancement.`;
        }


        function checkFormValidity() {
            const isReady = categorySelect.value && advancementSelect.value;
            createBtn.disabled = !isReady;
        }

        function generateJson() {
            const advancementKey = advancementSelect.value;
            const path = advancementKey.split(':')[1];
            const idForLang = path.replace(/\//g, '_');
            const fileContent = {
                id: idForLang,
                unit: 'int',
                reader: { "$type": "set-count", path: ["advancements", `minecraft:${path}`, "criteria"] }
            };
            
            const jsonString = JSON.stringify(fileContent, null, 4);
            jsonOutput.textContent = jsonString;

            const awardTitle = awardTitleInput.value;
            const awardDesc = awardDescInput.value;
            const langContent = `{\n    "award.${idForLang}.desc": "${awardDesc}",\n    "award.${idForLang}.title": "${awardTitle}"\n}`;
            langOutput.textContent = langContent;

            outputSection.classList.remove('hidden');

            const blob = new Blob([jsonString], { type: 'application/json' });
            downloadLink.href = URL.createObjectURL(blob);
            downloadLink.download = `${fileContent.id}.json`;
        }

        // --- Event Listeners ---
        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('bg-gray-700', 'border-cyan-400'); });
        dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.classList.remove('bg-gray-700', 'border-cyan-400'); });
        dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.classList.remove('bg-gray-700', 'border-cyan-400'); handleFile(e.dataTransfer.files[0]); });
        dropZone.addEventListener('click', (e) => {
            if (e.target !== fileInput) {
              fileInput.click();
            }
        });

        viewerTabBtn.addEventListener('click', () => switchTab('viewer'));
        creatorTabBtn.addEventListener('click', () => switchTab('creator'));

        uploadNewBtn.addEventListener('click', (e) => {
            e.preventDefault();
            toolSection.classList.add('hidden');
            uploadSection.classList.remove('hidden');
            uploadNewBtn.classList.add('hidden');
            playerNameDisplay.textContent = '';
            fileNameDisplay.textContent = '';
            errorMessage.textContent = '';
            loadedAdvancements = {};
            playerSkinContainer.classList.add('hidden');
            playerSkinImg.src = '';
        });

        categorySelect.addEventListener('change', () => {
            const categoryKey = categorySelect.value;
            populateSelect(advancementSelect, categorizedAdvancements[categoryKey], 'Choose an advancement...');
            localizationInputs.classList.add('hidden');
            outputSection.classList.add('hidden');
            checkFormValidity();
        });
        
        advancementSelect.addEventListener('change', () => {
            updateLocalizationInputs();
            checkFormValidity();
        });
        
        createBtn.addEventListener('click', (e) => { e.preventDefault(); if (!createBtn.disabled) generateJson(); });
    </script>
</body>
</html>
